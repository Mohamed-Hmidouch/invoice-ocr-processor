###############################################################################
# Docker Compose — PostgreSQL pour le pipeline Invoice Processor
#
# Usage :
#   docker compose up -d          → Démarrer la base
#   docker compose down           → Arrêter (données persistées dans le volume)
#   docker compose down -v        → Arrêter ET supprimer les données
###############################################################################

services:
  invoice-db:
    image: postgres:16-alpine
    container_name: invoice-db
    restart: unless-stopped

    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      # Données persistantes
      - pgdata:/var/lib/postgresql/data
      # Script d'initialisation (exécuté une seule fois, au premier lancement)
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── API FastAPI + PaddleOCR ────────────────────────────────────────────────
  invoice-api:
    image: mohamedhmidouch/ocr-api:1.0.0
    container_name: invoice-api
    restart: unless-stopped

    depends_on:
      invoice-db:
        condition: service_healthy

    # Secrets et config charges depuis .env (jamais dans l'image)
    env_file:
      - .env

    environment:
      # Dans le reseau compose, la DB est joignable via le nom du service,
      # pas via localhost. On surcharge donc POSTGRES_HOST.
      POSTGRES_HOST: invoice-db
      POSTGRES_PORT: 5432

    ports:
      - "8000:8000"

    volumes:
      # Fichiers uploades et sorties persistes hors de l'image
      - ./data/uploads:/app/data/uploads
      - ./data/output:/app/data/output

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  pgdata:
    driver: local
